<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Learning LeadAbility</title>
  <meta name="description" content="Learn. Lead. Lift.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a3350;
      --gold: #e0a02a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #fff;
      color: var(--navy);
      font-family: "Archivo", system-ui, sans-serif;
    }
    main { text-align: center; }
    .logo { margin: 0; font-size: clamp(3.2rem, 15vw, 8rem); line-height: 0.95; }
    .logo > span { display: block; }
    .the {
      font-weight: 300;
      font-size: 0.72em;
      letter-spacing: -0.02em;
    }
    .lead { font-weight: 800; letter-spacing: -0.045em; }
    .pillars {
      margin: 0.9em 0 0;
      padding-left: 0.42em;
      font-size: clamp(0.85rem, 3.4vw, 1.5rem);
      font-weight: 400;
      letter-spacing: 0.42em;
      white-space: nowrap;
    }
    .dot { color: var(--gold); margin: 0 0.5em 0 0.1em; }
    .profile {
      margin-top: 72px;
      color: var(--navy);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 4px;
    }
    .profile:hover { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1 class="logo">
      <span class="the">The Learning</span>
      <span class="lead">LeadAbility</span>
    </h1>
    <p class="pillars">LEARN <span class="dot">&bull;</span>LEAD <span class="dot">&bull;</span>LIFT</p>
  </main>
  <a class="profile" href="./about">Company profile &rarr;</a>
</body>
</html>
